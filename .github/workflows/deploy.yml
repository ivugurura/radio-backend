name: Backend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev --deploy

      - name: Run isort check
        run: pipenv run python -m isort --check-only .

      - name: Run black check
        run: pipenv run python -m black --check .

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_type == 'branch'

    steps:
      - name: Deploy over SSH (server-side build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="${DEPLOY_PATH:-${{ secrets.APP_DIR }}}"
            BRANCH="${DEPLOY_BRANCH:-main}"
            SERVICE_NAME="${SERVICE_NAME:-radio-api}"
            CELERY_SERVICE="${CELERY_SERVICE:-radio-api-celery}"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Missing git repository at $REPO_DIR"
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            pipenv install --dev --deploy
            pipenv run python manage.py migrate --noinput
            pipenv run python manage.py collectstatic --noinput

            sudo systemctl restart "$SERVICE_NAME"
            if systemctl list-unit-files | grep -q "^${CELERY_SERVICE}\\.service"; then
              sudo systemctl restart "$CELERY_SERVICE"
            fi

            sudo systemctl is-active --quiet "$SERVICE_NAME"
